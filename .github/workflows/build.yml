# Пересобирает страницы игр, список в index.html и sitemap.xml после правки games.js
name: Собрать страницы
on:
  push:
    branches: [main]
    paths: [games.js, tools/build.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build.py
      - name: Сохранить изменения
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Пересборка страниц из games.js"
          git push
